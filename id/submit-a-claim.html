<header>

        <a href="submit-a-claim.html">Klaim Kesehatan</a>

<section class="submit-section">

    <h2>Klaim Kesehatan</h2>

    <p>
        Pernah melihat klaim kesehatan di internet dan tidak yakin apakah klaim tersebut benar?
        Kirimkan kepada SANARE, dan kami akan mengamati serta menyelidikinya.
    </p>

    <form
        class="claim-form"
        action="https://formspree.io/f/xaqgeqzg"
        method="POST">

        <label>Klaim Kesehatan</label>
        <input type="text" name="claim" required>

        <label>Di mana Anda melihat klaim ini?</label>
        <input type="text" name="source" required>

        <label>Catatan Tambahan</label>
        <textarea name="notes"></textarea>

        <button type="submit">
            Kirim Klaim
        </button>

    </form>

</section>
